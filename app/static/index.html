<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal & Wasalt Assistant</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8e8ea; --muted:#9aa0ac; --gold:#c9a45c; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:17px; font-weight:600; letter-spacing:.3px; }
  header h1 span { color:var(--gold); }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:0 0 14px; padding:11px 14px; border-radius:12px; white-space:pre-wrap; max-width:88%; }
  .user { background:#2b3345; margin-left:auto; }
  .bot { background:var(--panel); border:1px solid var(--line); }
  .src { margin-top:8px; font-size:12px; color:var(--muted); }
  .src a { color:var(--gold); text-decoration:none; margin-right:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--gold); }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15px; }
  input:focus { outline:none; border-color:var(--gold); }
  button.send { padding:0 20px; border:0; border-radius:10px; background:var(--gold); color:#1a1405; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1><span>DarGlobal</span> &amp; Wasalt Assistant</h1>
  <p>Ask about DarGlobal's luxury developments or Wasalt's Saudi real estate platform. Answers come from their public websites.</p>
</header>
<div id="log">
  <div class="chips" id="chips">
    <button class="chip">Who is DarGlobal?</button>
    <button class="chip">Tell me about Trump Tower Jeddah</button>
    <button class="chip">What is Wasalt and who owns it?</button>
    <button class="chip">What services does Wasalt offer?</button>
    <button class="chip">Which hospitality projects does DarGlobal have?</button>
  </div>
</div>
<form id="f">
  <input id="q" placeholder="Type your question..." autocomplete="off" required>
  <button class="send" id="b">Send</button>
</form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b');
let history = [];
function md(t) {  // escape first, then allow only bold, bullets and bare links
  const e = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/^\s*[-*] /gm,'• ')
          .replace(/(https?:\/\/[^\s)<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--gold)">$1</a>');
}
function add(cls, text, sources) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (cls === 'bot') d.innerHTML = md(text); else d.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div'); s.className = 'src'; s.append('Sources: ');
    sources.forEach(x => { const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = x.source + ' · ' + (new URL(x.url).pathname.split('/').filter(Boolean).pop() || 'home') + ' ↗'; s.append(a); });
    d.append(s);
  }
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}
async function ask(text) {
  document.getElementById('chips')?.remove();
  add('user', text); b.disabled = true;
  const wait = add('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: text, history }) });
    const j = await r.json(); wait.remove(); add('bot', j.answer, j.sources);
    history.push({role:'user', content:text}, {role:'assistant', content:j.answer});
  } catch (e) { wait.textContent = 'Network error. Please try again.'; }
  b.disabled = false; q.focus();
}
f.addEventListener('submit', e => { e.preventDefault(); const t = q.value.trim(); if (t) { q.value = ''; ask(t); } });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => ask(c.textContent));
</script>
</body>
</html>
